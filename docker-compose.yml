# Local development database only.
services:
  postgres:
    image: postgres:17
    container_name: parityfi-postgres
    environment:
      POSTGRES_USER: parityfi
      POSTGRES_PASSWORD: parityfi-dev
      POSTGRES_DB: parityfi
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - parityfi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parityfi -d parityfi"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  parityfi-pgdata:
